name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.44.4'

jobs:
  backend:
    name: Backend (api)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playle
          POSTGRES_PASSWORD: playle_ci_password
          POSTGRES_DB: playle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://playle:playle_ci_password@localhost:5432/playle_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CORS_ORIGINS: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint:api

      - name: Typecheck
        run: npm run typecheck:api

      - name: Format check
        run: npm run format:check --workspace=apps/api

      - name: Unit + e2e tests
        run: |
          npm run test:api
          npm run test:e2e --workspace=apps/api

      - name: Build
        run: npm run build:api

  admin:
    name: Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:admin

      - name: Typecheck
        run: npm run typecheck:admin

      - name: Format check
        run: npm run format:check --workspace=apps/admin

      - name: Test
        run: npm run test:admin

      - name: Build
        run: npm run build:admin

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android (debug)
        working-directory: apps/mobile
        run: flutter build apk --debug
