name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.44.4'

jobs:
  backend:
    name: Backend (api)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playle
          POSTGRES_PASSWORD: playle_ci_password
          POSTGRES_DB: playle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://playle:playle_ci_password@localhost:5432/playle_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CORS_ORIGINS: http://localhost:3001
      # Ephemeral CI-only secret for a throwaway database — never used outside this job.
      JWT_ACCESS_SECRET: ci-only-test-secret-this-is-not-used-anywhere-real
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 30
      AUTH_MIN_AGE_YEARS: 16
      # Raised well above the production default (5) so the e2e suite's many
      # register/login calls in quick succession don't trip the throttle.
      AUTH_THROTTLE_LIMIT: 1000
      AUTH_THROTTLE_TTL_MS: 60000
      # The global 'default' throttler (ThrottlerGuard is an APP_GUARD, so
      # it applies to every request) is also raised well above its 100
      # production default — the wallet/deposits/withdrawals e2e suite
      # alone makes far more than 100 requests in well under 60s.
      THROTTLE_LIMIT: 1000
      THROTTLE_TTL_MS: 60000
      # No real Monime credentials ever go into CI — the active provider
      # is the network-call-free ManualProvider (see ADR-013). The e2e
      # webhook tests use a separately-bound test double, not this
      # setting. Also raised above the production default for the same
      # reason as AUTH/THROTTLE above.
      PAYMENTS_PROVIDER: manual
      PAYMENTS_THROTTLE_LIMIT: 1000
      PAYMENTS_THROTTLE_TTL_MS: 60000
      # Raised for the same reason as THROTTLE_LIMIT above — the matches/
      # matchmaking/challenges e2e suites make far more than the
      # production default (30) in well under 60s. Grace/sweep intervals
      # shortened so the abandonment-sweep e2e assertions don't need to
      # wait a real 30s.
      MATCHES_THROTTLE_LIMIT: 1000
      MATCHES_THROTTLE_TTL_MS: 60000
      CHALLENGE_EXPIRY_MS: 120000
      MATCH_ABANDON_GRACE_MS: 5000
      MATCH_TIMEOUT_SWEEP_INTERVAL_MS: 2000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint:api

      - name: Typecheck
        run: npm run typecheck:api

      - name: Format check
        run: npm run format:check --workspace=apps/api

      - name: Unit + e2e tests
        run: |
          npm run test:api
          npm run test:e2e --workspace=apps/api

      - name: Build
        run: npm run build:api

  admin:
    name: Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:admin

      - name: Typecheck
        run: npm run typecheck:admin

      - name: Format check
        run: npm run format:check --workspace=apps/admin

      - name: Test
        run: npm run test:admin

      - name: Build
        run: npm run build:admin

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android (debug)
        working-directory: apps/mobile
        run: flutter build apk --debug
