name: playle

services:
  postgres:
    image: postgres:16-alpine
    container_name: playle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playle_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-playle_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - playle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-playle}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: playle-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - playle_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  playle_postgres_data:
  playle_redis_data:
